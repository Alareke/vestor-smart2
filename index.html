    <script>
  (function(){
    try {
      var saved = localStorage.getItem('theme');
      var systemDark = window.matchMedia &&
                       window.matchMedia('(prefers-color-scheme: dark)').matches;
      var dark = saved ? (saved === 'dark') : systemDark;
      document.documentElement.classList.toggle('dark', dark);
    } catch(e) {}
  })();
</script>

    <div id="root"></div>

<script>
(function(){
  try{
    var img = document.getElementById('app-logo');
    if(!img) return;
    function apply(){
      var isDark = document.documentElement.classList.contains('dark');
      var darkSrc = img.getAttribute('data-dark');
      var lightSrc = img.getAttribute('data-light');
      img.src = isDark ? (darkSrc || img.src) : (lightSrc || img.src);
    }
    apply();
    var mo = new MutationObserver(apply);
    mo.observe(document.documentElement,{attributes:true,attributeFilter:['class']});
    // Also listen for storage/theme-toggle if exists
    window.addEventListener('storage', function(e){ if(e.key==='theme') apply(); });
    var btn = document.getElementById('theme-toggle'); if(btn){ btn.addEventListener('click', apply); }
  }catch(e){}
})();
</script>
